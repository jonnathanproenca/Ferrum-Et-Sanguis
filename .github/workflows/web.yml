name: Web (Godot)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Testes de paridade com o jogo em TypeScript
        run: |
          godot --headless --import || true
          godot --headless -s tests/executar.gd
      - name: Exportar para Web
        run: |
          mkdir -p build/web ~/.local/share/godot
          cp -r /root/.local/share/godot/export_templates ~/.local/share/godot/
          godot --headless --import || true
          godot --headless --export-release "Web" build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
